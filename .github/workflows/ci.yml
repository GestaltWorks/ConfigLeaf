# CI proves what a judge's clean clone proves: the code typechecks, the unit tests pass, both vendored
# Meterless conformance suites (World Model, H-MEM) pass through our modules, the sample pass runs with
# no credentials, every committed signed receipt (receipts.json) verifies offline against the call records
# beside it, and the committed replay page (docs/) is exactly the build of the committed examples.
# The live sponsor spikes (Nightshift, Zetaris) run locally with `npm run smoke`; they need the
# runtime on the builder's machine and are recorded in logs/ and in the README instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The committed technician's lessons (H-MEM store), so CI decides with the lessons the committed examples and docs/ were built with.
      DRIFT_MEMORY_DIR: examples/memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Copy validation, live (nginx -t in nginx:1.27 over test/fixtures/nginx-tree; docker and openssl are on the runner)
        run: VALIDATE_LIVE=true npx vitest run test/validate.test.ts
      - name: World Model conformance (vendored suite against src/engine/world.ts)
        run: npm run conformance
      - name: H-MEM conformance (vendored suite against the vendored reference, re-exported by src/engine/memory.ts; TechnicianMemory is covered by test/memory.test.ts and one wrapper check here)
        run: npm run conformance:hmem
      - name: Sample mode runs without credentials
        run: SAMPLE_MODE=true npm run sample
      - name: Signed receipts verify offline against their call records (every committed receipts.json)
        run: |
          files=$(git ls-files -- '*receipts.json')
          if [ -z "$files" ]; then echo "receipts: no committed receipts.json"; exit 0; fi
          for f in $files; do npm run -s receipts:verify -- "$(dirname "$f")"; done
      - name: Replay page rebuilds from the committed examples and matches the committed docs/
        run: |
          npm run site
          git diff --exit-code -- docs
      - name: No secrets committed
        run: |
          # git grep exits 1 for no match; anything above 1 means the scan itself did not run, and that fails the step.
          rc=0
          hits=$(git grep -nE 'nvapi-[A-Za-z0-9_-]{20,}|sk-or-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|rt-[A-Za-z0-9]{24,}' -- ':!.github/workflows/ci.yml') || rc=$?
          if [ "$rc" -gt 1 ]; then echo "secret scan did not run: git grep exited $rc"; exit 1; fi
          # The one allowance is the fake key the kit's vendored review test feeds its own redactor, in that file only.
          hits=$(printf '%s\n' "$hits" | grep -vE '^\.github/scripts/test_claude_review\.py:[0-9]+:.*sk-ant-api03-AbCdEf0123456789ZzYyXx' || true)
          # Only the file and line are printed, so a real key is not copied into the job log.
          if [ -n "$hits" ]; then printf '%s\n' "$hits" | cut -d: -f1,2; echo "secret-looking string found"; exit 1; fi
