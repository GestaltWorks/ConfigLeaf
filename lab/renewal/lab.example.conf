# renew_before_expiry = 30 days
version = 2.1.0
archive_dir = /etc/letsencrypt/archive/lab.example
cert = /etc/letsencrypt/live/lab.example/cert.pem
privkey = /etc/letsencrypt/live/lab.example/privkey.pem
chain = /etc/letsencrypt/live/lab.example/chain.pem
fullchain = /etc/letsencrypt/live/lab.example/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 00000000000000000000000000000000
authenticator = nginx
installer = nginx
server = https://acme.lab.example/directory
key_type = ecdsa
