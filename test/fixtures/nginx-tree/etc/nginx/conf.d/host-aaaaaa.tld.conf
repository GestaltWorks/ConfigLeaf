server {
    listen 80;
    server_name host-aaaaaa.tld;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name host-aaaaaa.tld;

    ssl_certificate /etc/letsencrypt/live/host-aaaaaa.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/host-aaaaaa.tld/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
