# app.invalid: every subdomain of the app is one upstream on loopback. Proxied through the CDN since
# 2026-04-16; nothing here names the CDN's ranges, so $remote_addr is the edge, not the visitor.
server {
    listen 80;
    listen [::]:80;
    server_name app.invalid *.app.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.invalid *.app.invalid;

    ssl_certificate     /etc/letsencrypt/live/app.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.invalid/privkey.pem;
    include snippets/ssl-params.conf;

    access_log /var/log/nginx/app.invalid.access.log main;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_read_timeout 120s;
    }
}
