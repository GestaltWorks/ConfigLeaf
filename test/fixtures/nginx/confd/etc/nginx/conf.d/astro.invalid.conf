server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name astro.invalid;

    ssl_certificate     /etc/letsencrypt/live/astro.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro.invalid/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/astro;
    index index.html;

    location /api/ {
        proxy_pass https://api.upstream.invalid/v1/;
        proxy_set_header Host api.upstream.invalid;
        proxy_ssl_server_name on;
    }
}
