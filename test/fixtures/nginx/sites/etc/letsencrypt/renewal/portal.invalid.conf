# renew_before_expiry = 30 days
version = 2.11.0
archive_dir = /etc/letsencrypt/archive/portal.invalid
cert = /etc/letsencrypt/live/portal.invalid/cert.pem
privkey = /etc/letsencrypt/live/portal.invalid/privkey.pem
chain = /etc/letsencrypt/live/portal.invalid/chain.pem
fullchain = /etc/letsencrypt/live/portal.invalid/fullchain.pem

# Options used in the renewal process
[renewalparams]
account = 0123456789abcdef0123456789abcdef
authenticator = nginx
installer = nginx
key_type = ecdsa
